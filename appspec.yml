
version: 0.0
os: linux

files:
  - source: out
    destination: /var/www/nextjs-site

hooks:
  BeforeInstall:
    - location: scripts/install_nginx.sh
      timeout: 300
      runas: root

  AfterInstall:
    - location: scripts/configure_nginx.sh
      timeout: 300
      runas: root

  ValidateService:
    - location: scripts/validate_site.sh
      timeout: 60
      runas: root